<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Member User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--Ang color di pagkilimti
    - brown base
    -
    -
    -->




    <div id="headerbox">
        <div>
            <h1>Online Member User Registration</h1>
        </div>
        <hr>
    </div>

    <div id="contentbox">

        <div class="content single">
            <h4>CRN / SS Number:</h4>
            <input type="text" class="cssNum">
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>Email Address:</h4>
                <input type="text" class="Email">
            </div>

            <div class="form-content">
                <h4>Confirm Email Address:</h4>
                <input type="text" class="confEmail">
            </div>
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>Create Username</h4>
                <input type="text" class="usrID">
            </div>

            <div class="form-content">
                <h4>Confirm Username</h4>
                <input type="text" class="confusrID">
            </div>
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>First Name:</h4>
                <input type="text" class="fname">
            </div>

            <div class="form-content">
                <h4>Last Name:</h4>
                <input type="text" class="lname">
            </div>
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>M.I.</h4>
                <input type="text" class="mname">
            </div>

            <div class="form-content">
                <h4>Date of Birth</h4>
                <input type="date" class="dob">
            </div>
        </div>

        <div class="content single">
            <h4>House no./Street/Subdivision or Purok</h4>
            <input type="text" class="add">
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>Province</h4>
                <select id="province" class="custom-select">
                    <option value="">-- Select Province --</option>
                    <option value="SouthCotabato">South Cotabato</option>
                    <option value="Cebu">Cebu</option>
                    <option value="Laguna">Laguna</option>
                </select>
            </div>

            <div class="form-content">
                <h4>City/Municipality</h4>
                <select id="city" class="custom-select" disabled>
                    <option value="">-- Select Province First --</option>
                </select>
            </div>
        </div>

        <div class="content double">
            <div class="form-content">
                <h4>Barangay</h4>
                <select id="barangay" class="custom-select" disabled>
                    <option value="">-- Select City First --</option>
                </select>
            </div>

            <div class="form-content">
                <h4>Zip Code</h4>
                <input type="text" class="zipc">
            </div>
        </div>

    </div>

    <div id="footerbox">
        <button id="submitBtn">Submit Registration</button>
    </div>





    <script src="script.js"></script>

</body>
</html>
